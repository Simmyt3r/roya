{% extends "base.html" %}
{% block title %}Create account · iRoya{% endblock %}
{% block content %}
<section class="shell auth-shell">
  <form class="card auth-card auth-card-wide" data-auth-form="register">
    <div>
      <div class="eyebrow">Join iRoya</div>
      <h1>What are you here to do?</h1>
      <p class="muted">Choose your starting workspace. Hotel accounts still have access to guest booking.</p>
    </div>

    <div class="account-type-grid" role="radiogroup" aria-label="Account type">
      <label class="account-type-option">
        <input type="radio" name="account_type" value="guest" checked>
        <span class="account-type-card">
          <strong>Book stays</strong>
          <small>Search hotels, reserve rooms and manage your personal stays.</small>
        </span>
      </label>
      <label class="account-type-option">
        <input type="radio" name="account_type" value="hotel">
        <span class="account-type-card">
          <strong>Manage a hotel</strong>
          <small>Create properties, rooms, rates, inventory and reservations.</small>
        </span>
      </label>
    </div>

    <label>Name<input name="name" autocomplete="name" required minlength="2"></label>
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <button class="button" type="submit">Create account</button>
    <p class="form-message" aria-live="polite"></p>
    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
  </form>
</section>
{% endblock %}
