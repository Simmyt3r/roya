name: iRoya Release CI
on:
  push:
    branches: [v3-flask, main, "release/v1.0-hardening"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: python -m compileall app.py roya scripts tests
      - run: pytest --cov=roya --cov-report=term-missing --cov-fail-under=60
      - run: pip-audit -r requirements.txt
