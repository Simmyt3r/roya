[project]
name = "iroya"
version = "0.1.0"
description = "Roya hotel commerce and booking platform"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.2",
  "Flask-WTF==1.2.2",
  "pydantic==2.11.9",
  "psycopg[binary]==3.2.10",
  "requests==2.32.5",
  "supabase==2.18.1",
  "python-dotenv==1.1.1",
  "gunicorn==23.0.0",
  "email-validator==2.2.0"
]

[tool.vercel]
entrypoint = "app:app"
